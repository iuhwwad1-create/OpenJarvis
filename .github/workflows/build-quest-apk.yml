name: Build Quest 3 APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-quest-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build standalone Quest APK
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenJarvis-Quest3-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

